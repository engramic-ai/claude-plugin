name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/engramic/.claude-plugin/plugin.json plugins/engramic/hooks/hooks.json plugins/engramic/config.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
      - name: Hook tests
        run: node --test plugins/engramic/test/hook.test.mjs plugins/engramic/test/scan.test.mjs plugins/engramic/test/workspace.test.mjs
